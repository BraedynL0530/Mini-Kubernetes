syntax = "proto3";
option go_package = "./pb";
package proto;

service MeowletService {
  rpc StartPaw(StartPawRequest) returns (StartPawResponse);
  rpc StopPaw(StopPawRequest) returns (StopPawResponse);
}


message StartPawRequest {
  string paw_id = 1;
  string image = 2;
  double cpu_limit = 3;
  int64 memory_limit = 4;
}

message StartPawResponse{
  bool success = 1;
}

message StopPawRequest{
  string paw_id =1; // add grace periord NEXT to give a graceful stop before murdering the paw
}

message StopPawResponse{
  bool success = 1;
}